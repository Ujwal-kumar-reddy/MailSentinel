services:
  - type: web
    name: mailsentinel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: CORS_ORIGINS
        sync: false
      - key: OPENBLAS_NUM_THREADS
        value: "1"
